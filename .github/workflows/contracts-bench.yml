name: Contracts benchmark

# Encode, decode and preview throughput of codecs (tools/Fx.Contracts.Bench, docs/modules/contracts.md
# "Performance") on an idle runner. Results go to the job summary; nothing fails on numbers. Pure
# managed code, so one OS is enough. Never on pull requests: weekly, or by hand
# (`gh workflow run "Contracts benchmark" --ref <branch>` after changing the contracts).
on:
  workflow_dispatch:
  schedule:
    - cron: "37 6 * * 0"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

jobs:
  bench:
    name: Bench (ubuntu-24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"
      - name: Restore (locked)
        run: dotnet restore tools/Fx.Contracts.Bench --locked-mode
      - name: Build
        run: dotnet build tools/Fx.Contracts.Bench --no-restore --configuration Release
      - name: Measure
        run: |
          echo "### Contracts benchmark" >> "$GITHUB_STEP_SUMMARY"
          dotnet run --project tools/Fx.Contracts.Bench --no-build --configuration Release | tee -a "$GITHUB_STEP_SUMMARY"

name: CI

on:
  push:
    branches: [main]
  pull_request:
    # `labeled`: adding the `ci:full` label reruns a pull request in the full tier.
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      full:
        description: Run every target (the full tier)
        type: boolean
        default: true
  schedule:
    # The full tier every night, so main is checked on every target even between merges.
    - cron: "23 3 * * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
  # .NET SDK image with the Native AOT prerequisites, for the musl targets. Keep the SDK version in
  # step with global.json; the digest pins the multi-arch manifest (amd64 and arm64).
  ALPINE_SDK_IMAGE: mcr.microsoft.com/dotnet/sdk:11.0.100-alpine3.24-aot@sha256:a6a89666d050f5d4806aa03edbc677291c7fb92191b5b2a8f3bccdec869ab87a

# A pull request runs five jobs: plan, lint and one `os` job per OS. The full tier (main, the
# schedule, manual runs, the `ci:full` label) adds the `targets` job's five other targets.
# In the os and targets jobs, every part runs once what it needs has succeeded, even when another part
# failed (`!cancelled() && steps.<id>.outcome == 'success'`), so one run reports the tests, Native AOT
# and each area on their own.
jobs:
  # What this run runs (scripts/ci-plan.ts): the tier, whether there is code to build, and which
  # areas' steps run (every one in the full tier, otherwise those whose files changed).
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.plan.outputs.full }}
      code: ${{ steps.plan.outputs.code }}
      keyring: ${{ steps.plan.outputs.keyring }}
      sandbox: ${{ steps.plan.outputs.sandbox }}
      bun: ${{ steps.plan.outputs.bun }}
      spike: ${{ steps.plan.outputs.spike }}
      targets: ${{ steps.plan.outputs.targets }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          FULL_INPUT: ${{ inputs.full }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bun scripts/ci-plan.ts

  # Formatting, the analyzers and the TypeScript packages; the .NET steps only when there is code.
  lint:
    name: Lint
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CODE: ${{ needs.plan.outputs.code }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        if: env.CODE == 'true'
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - name: Task graph is current
        run: bun scripts/tasks.ts check
      - name: The CI plan's rules
        run: bun test scripts/ci-plan.test.ts
      # The golden declarations are the generator's output (the os jobs' tests keep them current).
      - name: Generated TypeScript declarations type-check
        run: bun scripts/declarations.ts
      # Its conformance suite runs in the os jobs (tests/Fx.Kernel.Tests), on the pinned Bun.
      - name: bun-ts kernel type-checks and its unit tests pass
        working-directory: packages/kernel-bun-ts
        run: |
          bun install --frozen-lockfile
          bun check --no-script
          bun test
      # The TypeScript SDK and its sample: types, codecs against the F# fixtures, the server. The
      # sample's parity suites run in the os jobs (tests/Fx.Extensions.Tests), on the pinned Bun.
      - name: TypeScript SDK type-checks and its unit tests pass
        working-directory: packages/sdk
        run: |
          bun install --frozen-lockfile
          bun check --no-script
          bun test
      - name: TypeScript sample extension type-checks and its unit tests pass
        working-directory: packages/sample-extension
        run: |
          bun install --frozen-lockfile
          bun check --no-script
          bun test
      - name: Restore tools
        if: env.CODE == 'true'
        run: dotnet tool restore
      - name: Formatting
        if: env.CODE == 'true'
        run: dotnet fantomas --check src tests tools extensions
      - name: Restore (locked)
        if: env.CODE == 'true'
        run: dotnet restore Fx.slnx --locked-mode
      - name: Analyzers
        if: env.CODE == 'true'
        run: bun scripts/analyzers.ts
      - name: Analyzers reject the failing samples
        if: env.CODE == 'true'
        run: bun scripts/analyzers.ts samples --no-build
      # The spike is superseded by packages/kernel-bun-ts: only when it changes, and in the full tier.
      # It runs the tests only; the kernel itself runs on the pinned Bun the tests download and verify.
      - name: Bun kernel spike
        if: needs.plan.outputs.spike == 'true'
        working-directory: spikes/bun-kernel
        run: |
          bun install --frozen-lockfile
          bun check --no-script
          bun test
          bun bench/bench.ts | tee -a "$GITHUB_STEP_SUMMARY"

  os:
    # Build and test on each OS, then Native AOT for the runner's own target (spec §20): publish the
    # CLI and the scenarios, smoke-test the binary, report its size, run the JIT-vs-native diff and
    # its self-test, natively (no cross-compilation, so each binary also runs where it was built).
    # Then the steps of the areas the plan names: the keyring (Linux and macOS; Windows' Credential
    # Manager is in the tests already), the sandbox scenarios with a live sandbox (Linux and macOS),
    # and the network Bun test off Linux.
    # The runners are fixed here; scripts/ci-plan.ts (OS_JOBS) lists the same, and its tests check it.
    name: Build, test and AOT (${{ matrix.rid }})
    needs: plan
    if: needs.plan.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: linux-x64, os: ubuntu-24.04 }
          - { rid: osx-arm64, os: macos-26 }
          - { rid: win-x64, os: windows-2025 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      RID: ${{ matrix.rid }}
      # A throwaway keyring's password for the keyring steps, not a secret.
      KEYRING_TEST_PASSWORD: keyring-ci-password
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      # Everything the locked restore and the publish for this target need (ILCompiler, runtime packs).
      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-aot-${{ matrix.rid }}-${{ hashFiles('global.json', 'Directory.Packages.props', '**/packages.lock.json') }}
          restore-keys: nuget-aot-${{ matrix.rid }}-
      # Native libraries built from source by the build (native/, e.g. SQLite). Their paths carry a
      # hash of their inputs, so a restored cache is either used as is or ignored.
      - name: Cache native libraries
        uses: actions/cache@v6
        with:
          path: artifacts/native
          key: native-${{ matrix.rid }}-${{ hashFiles('native/**') }}
      # The pinned Bun the reference kernel runs on in the kernel conformance suite; the tests
      # download it and check its digest (tests/Fx.Kernel.Tests/PinnedBun.fs holds the pin).
      - name: Cache the pinned Bun
        uses: actions/cache@v6
        with:
          path: artifacts/kernel-bun-ts/runtimes
          key: pinned-bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tests/Fx.Kernel.Tests/PinnedBun.fs') }}
      # Runs scripts/packages.ts; the extensions themselves run on the pinned Bun the tests download.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      # The sandbox drivers' suites require a driver that confines (SANDBOX_TESTS=1): Seatbelt is part
      # of macOS; bubblewrap is installed here, and Ubuntu 24.04's AppArmor restriction on user
      # namespaces lifted (docs/modules/sandbox.md says what users do instead).
      - name: Install bubblewrap and let it create user namespaces (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --ro-bind / / --unshare-all --die-with-parent -- /bin/true
      - name: Restore (locked)
        run: dotnet restore Fx.slnx --locked-mode
      - name: Build
        id: build
        run: dotnet build Fx.slnx --no-restore --configuration Release

      # Build and test.
      # Packs the SDKs and builds the sample extension from the packages alone; the tests run it.
      - name: Pack the SDKs and build an extension from the packages
        id: packages
        run: bun scripts/packages.ts
      - name: Test
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          PACKAGE_TESTS: "1"
          SANDBOX_TESTS: "1"
        run: dotnet test --solution Fx.slnx --no-build --configuration Release
      - name: Upload the SDK packages
        if: ${{ !cancelled() && steps.packages.outcome == 'success' && runner.os == 'Linux' }}
        uses: actions/upload-artifact@v7
        with:
          name: sdk-packages
          path: artifacts/packages/
          if-no-files-found: error
      # Installs the pinned Bun (fx.runtime.bun) from GitHub through the planner and the component
      # installer, launches it hardened, and runs the positive controls. Its own step, so a network
      # failure is told apart from a failing test. Off Linux (two minutes on Windows) only when the
      # runtime, the installer or the kernel changed, and in the full tier.
      - name: Install and launch the pinned Bun (network)
        if: ${{ !cancelled() && steps.build.outcome == 'success' && (runner.os == 'Linux' || needs.plan.outputs.bun == 'true') }}
        env:
          NETWORK_TESTS: "1"
        run: dotnet test --project tests/Fx.Ext.RuntimeBun.Tests --no-build --configuration Release

      # Native AOT for this runner's target (.github/scripts/aot-smoke.sh holds the smoke tests).
      - name: Publish the CLI
        id: cli
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: dotnet publish src/Fx.Cli --configuration Release --runtime "$RID"
      - name: Publish the AOT scenarios
        id: scenarios
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: dotnet publish tests/aot/Fx.Aot.Scenarios --configuration Release --runtime "$RID"
      - name: Smoke test the native binary
        id: smoke
        if: ${{ !cancelled() && steps.cli.outcome == 'success' }}
        shell: bash
        run: bash .github/scripts/aot-smoke.sh binary "$RID"
      - name: Smoke test envd mode
        if: ${{ !cancelled() && steps.smoke.outcome == 'success' }}
        shell: bash
        run: bash .github/scripts/aot-smoke.sh envd "$RID"
      - name: Smoke test the embedded host
        if: ${{ !cancelled() && steps.smoke.outcome == 'success' }}
        shell: bash
        run: bash .github/scripts/aot-smoke.sh host "$RID"
      - name: SQLite is linked into the binary
        if: ${{ !cancelled() && steps.smoke.outcome == 'success' }}
        shell: bash
        run: bash .github/scripts/aot-smoke.sh sqlite "$RID"
      - name: Report binary sizes
        if: ${{ !cancelled() && steps.smoke.outcome == 'success' && steps.scenarios.outcome == 'success' }}
        shell: bash
        run: bash .github/scripts/aot-smoke.sh sizes "$RID"
      - name: JIT-vs-native diff
        if: ${{ !cancelled() && steps.cli.outcome == 'success' && steps.scenarios.outcome == 'success' }}
        shell: bash
        run: dotnet run --project tests/aot/Fx.Aot.Diff --configuration Release -- --rid "$RID" --no-publish
      - name: JIT-vs-native diff self-test
        if: ${{ !cancelled() && steps.cli.outcome == 'success' && steps.scenarios.outcome == 'success' }}
        shell: bash
        run: dotnet run --project tests/aot/Fx.Aot.Diff --configuration Release --no-build -- --rid "$RID" --no-publish --self-test
      - name: Upload the native binary
        if: ${{ !cancelled() && steps.smoke.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.smoke.outputs.name }}-${{ matrix.rid }}
          path: artifacts/publish/Fx.Cli/release_${{ matrix.rid }}/
          if-no-files-found: error

      # The keyring (src/Fx.Keyring, docs/spikes/keychains.md) where the runner has to provide one: a
      # gnome-keyring under dbus-run-session on Linux and a temporary keychain on macOS. Proves,
      # natively, that the probe tells every headless state apart, runs the live tests (the keyring's,
      # and the credential-store conformance suite on the keyring store, docs/modules/auth.md), and
      # runs the keyring scenarios of the JIT-vs-native diff. After the tests, so that no test before
      # them sees a Secret Service.
      - name: Install D-Bus and gnome-keyring (Linux)
        id: keyring-linux
        if: ${{ !cancelled() && steps.scenarios.outcome == 'success' && runner.os == 'Linux' && needs.plan.outputs.keyring == 'true' }}
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends dbus dbus-bin gnome-keyring libsecret-tools
      - name: Keyring headless detection, natively (Linux)
        if: ${{ !cancelled() && steps.keyring-linux.outcome == 'success' }}
        shell: bash
        run: sh .github/scripts/keyring-detect.sh "$RID"
      - name: Keyring live tests and the keyring scenarios of the JIT-vs-native diff (Linux)
        if: ${{ !cancelled() && steps.keyring-linux.outcome == 'success' }}
        shell: bash
        run: sh .github/scripts/keyring-live.sh "$RID"
      - name: Create a temporary keychain (macOS)
        id: keychain
        if: ${{ !cancelled() && steps.scenarios.outcome == 'success' && runner.os == 'macOS' && needs.plan.outputs.keyring == 'true' }}
        shell: bash
        run: bash .github/scripts/keyring-macos.sh create "$RID"
      - name: Keyring live tests (macOS)
        if: ${{ !cancelled() && steps.keychain.outcome == 'success' }}
        shell: bash
        run: bash .github/scripts/keyring-macos.sh tests
      - name: The keyring scenarios of the JIT-vs-native diff (macOS)
        if: ${{ !cancelled() && steps.keychain.outcome == 'success' }}
        shell: bash
        run: bash .github/scripts/keyring-macos.sh scenarios "$RID"
      - name: Keyring headless detection, natively (macOS)
        if: ${{ !cancelled() && steps.keychain.outcome == 'success' }}
        shell: bash
        run: bash .github/scripts/keyring-macos.sh detect "$RID"
      - name: Delete the temporary keychain (macOS)
        if: ${{ always() && runner.os == 'macOS' && env.KEYRING_TEST_KEYCHAIN != '' }}
        shell: bash
        run: bash .github/scripts/keyring-macos.sh delete

      # The sandbox drivers (docs/modules/sandbox.md): the Test step already requires this OS's driver
      # (SANDBOX_TESTS=1); this diffs the sandbox scenarios with a process confined by it, natively.
      - name: The sandbox scenarios of the JIT-vs-native diff, with a live sandbox
        if: ${{ !cancelled() && steps.scenarios.outcome == 'success' && runner.os != 'Windows' && needs.plan.outputs.sandbox == 'true' }}
        shell: bash
        env:
          SANDBOX_TESTS: "1"
        run: dotnet run --project tests/aot/Fx.Aot.Diff --configuration Release -- --rid "$RID" --no-publish --only sandbox-

  targets:
    # The full tier's other targets (scripts/ci-plan.ts, TARGETS), natively: Native AOT publish, smoke
    # tests, binary sizes, the JIT-vs-native diff and its self-test. Each also runs what only it can
    # show (its matrix flags): the sandbox with bubblewrap on arm64 (the seccomp program is per
    # architecture) and Seatbelt on Intel macOS; the keyring in Alpine (gnome-keyring on musl) and on
    # Intel macOS; and fx.runtime.bun on musl (the pinned Bun's musl build) with fx.interpreter.bun-ts
    # on it. Targets without `suites` run only the areas' native scenarios and probes.
    name: Target (${{ matrix.rid }})
    needs: plan
    if: needs.plan.outputs.full == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.targets) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
    env:
      RID: ${{ matrix.rid }}
      # The musl targets run every command in the Alpine container started below.
      IN: ${{ matrix.alpine && 'docker exec alpine' || '' }}
      KEYRING_TEST_PASSWORD: keyring-ci-password
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        if: ${{ !matrix.alpine }}
        with:
          global-json-file: global.json
      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-aot-${{ matrix.rid }}-${{ hashFiles('global.json', 'Directory.Packages.props', '**/packages.lock.json') }}
          restore-keys: nuget-aot-${{ matrix.rid }}-
      - name: Cache native libraries
        uses: actions/cache@v6
        with:
          path: artifacts/native
          key: native-${{ matrix.rid }}-${{ hashFiles('native/**') }}
      # The sandbox suites' CodeAct live tests run the bun-ts kernel on the pinned Bun. Never in
      # Alpine: its musl Bun would share the glibc build's key.
      - name: Cache the pinned Bun
        if: ${{ matrix.sandbox && matrix.suites && !matrix.alpine }}
        uses: actions/cache@v6
        with:
          path: artifacts/kernel-bun-ts/runtimes
          key: pinned-bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tests/Fx.Kernel.Tests/PinnedBun.fs') }}
      - name: Start the Alpine container
        if: ${{ matrix.alpine }}
        run: >-
          docker run --detach --name alpine
          --user "$(id -u):$(id -g)" --env HOME=/tmp
          --env CI --env GITHUB_ACTIONS --env NUGET_PACKAGES --env KEYRING_TEST_PASSWORD
          --env DOTNET_CLI_TELEMETRY_OPTOUT --env DOTNET_NOLOGO --env DOTNET_SKIP_FIRST_TIME_EXPERIENCE
          --volume "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" --workdir "$GITHUB_WORKSPACE"
          "$ALPINE_SDK_IMAGE" sleep infinity
      # As in the os jobs: SANDBOX_TESTS=1 requires bubblewrap to confine. Alpine runs in a container
      # without user namespaces, so no musl target runs the sandbox suites.
      - name: Install bubblewrap and let it create user namespaces (Linux)
        if: ${{ matrix.sandbox && runner.os == 'Linux' }}
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --ro-bind / / --unshare-all --die-with-parent -- /bin/true
      - name: Restore (locked)
        id: restore
        run: $IN dotnet restore Fx.slnx --locked-mode
      # The test suites of this target's areas, built before the publishes below restore for the
      # target.
      - name: Build the area tests
        id: area-tests
        if: ${{ matrix.suites }}
        env:
          KEYRING: ${{ matrix.keyring }}
          SANDBOX: ${{ matrix.sandbox }}
          BUN: ${{ matrix.bun }}
        run: |
          projects=()
          [[ "$KEYRING" == true ]] && projects+=(Fx.Keyring.Tests Fx.Auth.Tests)
          [[ "$SANDBOX" == true ]] && projects+=(Fx.Environments.Tests Fx.Ext.SandboxBubblewrap.Tests Fx.Ext.SandboxSeatbelt.Tests Fx.CodeAct.Tests)
          [[ "$BUN" == true ]] && projects+=(Fx.Ext.RuntimeBun.Tests Fx.Kernel.Tests Fx.Ext.InterpreterBunTs.Tests)
          for project in "${projects[@]}"; do
            $IN dotnet build "tests/$project" --no-restore --configuration Release
          done

      # Native AOT for this target (.github/scripts/aot-smoke.sh holds the smoke tests).
      - name: Publish the CLI
        id: cli
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        run: $IN dotnet publish src/Fx.Cli --configuration Release --runtime "$RID"
      - name: Publish the AOT scenarios
        id: scenarios
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        run: $IN dotnet publish tests/aot/Fx.Aot.Scenarios --configuration Release --runtime "$RID"
      - name: Smoke test the native binary
        id: smoke
        if: ${{ !cancelled() && steps.cli.outcome == 'success' }}
        run: bash .github/scripts/aot-smoke.sh binary "$RID"
      - name: Smoke test envd mode
        if: ${{ !cancelled() && steps.smoke.outcome == 'success' }}
        run: bash .github/scripts/aot-smoke.sh envd "$RID"
      - name: Smoke test the embedded host
        if: ${{ !cancelled() && steps.smoke.outcome == 'success' }}
        run: bash .github/scripts/aot-smoke.sh host "$RID"
      - name: SQLite is linked into the binary
        if: ${{ !cancelled() && steps.smoke.outcome == 'success' }}
        run: bash .github/scripts/aot-smoke.sh sqlite "$RID"
      - name: Report binary sizes
        if: ${{ !cancelled() && steps.smoke.outcome == 'success' && steps.scenarios.outcome == 'success' }}
        run: bash .github/scripts/aot-smoke.sh sizes "$RID"
      - name: JIT-vs-native diff
        if: ${{ !cancelled() && steps.cli.outcome == 'success' && steps.scenarios.outcome == 'success' }}
        run: $IN dotnet run --project tests/aot/Fx.Aot.Diff --configuration Release -- --rid "$RID" --no-publish
      - name: JIT-vs-native diff self-test
        if: ${{ !cancelled() && steps.cli.outcome == 'success' && steps.scenarios.outcome == 'success' }}
        run: $IN dotnet run --project tests/aot/Fx.Aot.Diff --configuration Release --no-build -- --rid "$RID" --no-publish --self-test
      - name: Upload the native binary
        if: ${{ !cancelled() && steps.smoke.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.smoke.outputs.name }}-${{ matrix.rid }}
          path: artifacts/publish/Fx.Cli/release_${{ matrix.rid }}/
          if-no-files-found: error

      # The keyring, as in the os jobs: gnome-keyring in Alpine, a temporary keychain on macOS.
      - name: Install D-Bus and gnome-keyring (Alpine)
        id: keyring-linux
        if: ${{ !cancelled() && steps.area-tests.outcome == 'success' && steps.scenarios.outcome == 'success' && matrix.keyring && matrix.alpine }}
        run: |
          docker exec --user root alpine apk add --no-cache dbus gnome-keyring
          docker exec --user root alpine dbus-uuidgen --ensure
          # dbus-daemon refuses to start for a user that is not in the password database.
          docker exec --user root alpine sh -c "echo 'ci:x:$(id -u):$(id -g)::/tmp:/bin/sh' >> /etc/passwd"
      - name: Keyring headless detection, natively (Linux)
        if: ${{ !cancelled() && steps.keyring-linux.outcome == 'success' }}
        run: $IN sh .github/scripts/keyring-detect.sh "$RID"
      - name: Keyring live tests and the keyring scenarios of the JIT-vs-native diff (Linux)
        if: ${{ !cancelled() && steps.keyring-linux.outcome == 'success' }}
        run: $IN sh .github/scripts/keyring-live.sh "$RID"
      - name: Create a temporary keychain (macOS)
        id: keychain
        if: ${{ !cancelled() && steps.scenarios.outcome == 'success' && matrix.keyring && runner.os == 'macOS' }}
        run: bash .github/scripts/keyring-macos.sh create "$RID"
      - name: Keyring live tests (macOS)
        if: ${{ !cancelled() && steps.keychain.outcome == 'success' && steps.area-tests.outcome == 'success' && matrix.suites }}
        run: bash .github/scripts/keyring-macos.sh tests
      - name: The keyring scenarios of the JIT-vs-native diff (macOS)
        if: ${{ !cancelled() && steps.keychain.outcome == 'success' }}
        run: bash .github/scripts/keyring-macos.sh scenarios "$RID"
      - name: Keyring headless detection, natively (macOS)
        if: ${{ !cancelled() && steps.keychain.outcome == 'success' }}
        run: bash .github/scripts/keyring-macos.sh detect "$RID"
      - name: Delete the temporary keychain (macOS)
        if: ${{ always() && runner.os == 'macOS' && env.KEYRING_TEST_KEYCHAIN != '' }}
        run: bash .github/scripts/keyring-macos.sh delete

      # The sandbox drivers where the os jobs do not run them, each requiring its OS's driver
      # (SANDBOX_TESTS=1): with the suites, the conformance suite, sandboxed environments and the
      # bun-ts kernel in a sandbox (the CodeAct live tests); and the sandbox scenarios of the
      # JIT-vs-native diff.
      - name: Sandbox tests
        if: ${{ !cancelled() && steps.area-tests.outcome == 'success' && matrix.sandbox && matrix.suites }}
        env:
          SANDBOX_TESTS: "1"
        run: |
          for project in Fx.Environments.Tests Fx.Ext.SandboxBubblewrap.Tests Fx.Ext.SandboxSeatbelt.Tests Fx.CodeAct.Tests; do
            dotnet test --project "tests/$project" --no-build --configuration Release
          done
      - name: The sandbox scenarios of the JIT-vs-native diff, with a live sandbox
        if: ${{ !cancelled() && steps.scenarios.outcome == 'success' && matrix.sandbox }}
        env:
          SANDBOX_TESTS: "1"
        run: dotnet run --project tests/aot/Fx.Aot.Diff --configuration Release -- --rid "$RID" --no-publish --only sandbox-

      # fx.runtime.bun on musl (the os jobs cover glibc, macOS and Windows): installs the pinned Bun's
      # musl build from GitHub through the component installer, launches it hardened and runs the
      # positive controls. Then fx.interpreter.bun-ts on it: the kernel conformance suite and the
      # interpreter's end-to-end tests. The tests download the pinned Bun themselves and check its
      # digest.
      - name: Install and launch the pinned Bun (network)
        if: ${{ !cancelled() && steps.area-tests.outcome == 'success' && matrix.bun }}
        run: $IN env NETWORK_TESTS=1 dotnet test --project tests/Fx.Ext.RuntimeBun.Tests --no-build --configuration Release
      - name: bun-ts kernel conformance
        if: ${{ !cancelled() && steps.area-tests.outcome == 'success' && matrix.bun }}
        run: $IN dotnet test --project tests/Fx.Kernel.Tests --no-build --configuration Release
      - name: bun-ts interpreter
        if: ${{ !cancelled() && steps.area-tests.outcome == 'success' && matrix.bun }}
        run: $IN dotnet test --project tests/Fx.Ext.InterpreterBunTs.Tests --no-build --configuration Release

name: CI

on:
  push:
    branches: [main]
  pull_request:
    # `labeled`: adding the `ci:full` label reruns a pull request in the full tier.
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      full:
        description: Run every target (the full tier)
        type: boolean
        default: true
  schedule:
    # The full tier every night, so main is checked on every target even between merges.
    - cron: "23 3 * * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
  # .NET SDK image with the Native AOT prerequisites, for the musl jobs. Keep the SDK version in step
  # with global.json; the digest pins the multi-arch manifest (amd64 and arm64).
  ALPINE_SDK_IMAGE: mcr.microsoft.com/dotnet/sdk:11.0.100-alpine3.24-aot@sha256:a6a89666d050f5d4806aa03edbc677291c7fb92191b5b2a8f3bccdec869ab87a

jobs:
  # What this run runs (scripts/ci-plan.ts): the full tier on main, the schedule, manual runs, the
  # `ci:full` label and platform-sensitive changes; otherwise the fast tier, one AOT target per OS
  # family and each area's own jobs only when it changes.
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.plan.outputs.full }}
      code: ${{ steps.plan.outputs.code }}
      aot: ${{ steps.plan.outputs.aot }}
      aot-run: ${{ steps.plan.outputs.aot-run }}
      keyring: ${{ steps.plan.outputs.keyring }}
      keyring-run: ${{ steps.plan.outputs.keyring-run }}
      bun-musl: ${{ steps.plan.outputs.bun-musl }}
      bun-musl-run: ${{ steps.plan.outputs.bun-musl-run }}
      network-all-os: ${{ steps.plan.outputs.network-all-os }}
      spike: ${{ steps.plan.outputs.spike }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          FULL_INPUT: ${{ inputs.full }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bun scripts/ci-plan.ts

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - name: Task graph is current
        run: bun scripts/tasks.ts check
      - name: The CI plan's rules
        run: bun test scripts/ci-plan.test.ts
      # The golden declarations are the generator's output (the build job's tests keep them current).
      - name: Generated TypeScript declarations type-check
        run: bun scripts/declarations.ts
      - name: Restore tools
        run: dotnet tool restore
      - name: Formatting
        run: dotnet fantomas --check src tests tools extensions
      # Its conformance suite runs in the build job (tests/Fx.Kernel.Tests), on the pinned Bun.
      - name: bun-ts kernel type-checks and its unit tests pass
        working-directory: packages/kernel-bun-ts
        run: |
          bun install --frozen-lockfile
          bun check --no-script
          bun test
      # The TypeScript SDK and its sample: types, codecs against the F# fixtures, the server. The
      # sample's parity suites run in the build job (tests/Fx.Extensions.Tests), on the pinned Bun.
      - name: TypeScript SDK type-checks and its unit tests pass
        working-directory: packages/sdk
        run: |
          bun install --frozen-lockfile
          bun check --no-script
          bun test
      - name: TypeScript sample extension type-checks and its unit tests pass
        working-directory: packages/sample-extension
        run: |
          bun install --frozen-lockfile
          bun check --no-script
          bun test

  analyzers:
    name: Analyzers
    needs: plan
    if: needs.plan.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - name: Restore tools
        run: dotnet tool restore
      - name: Restore (locked)
        run: dotnet restore Fx.slnx --locked-mode
      - name: Analyzers
        run: bun scripts/analyzers.ts
      - name: Analyzers reject the failing samples
        run: bun scripts/analyzers.ts samples --no-build

  build:
    name: Build and test (${{ matrix.os }})
    needs: plan
    if: needs.plan.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"
      # Native libraries built from source by the build (native/, e.g. SQLite). Their paths carry a
      # hash of their inputs, so a restored cache is either used as is or ignored.
      - name: Cache native libraries
        uses: actions/cache@v6
        with:
          path: artifacts/native
          key: native-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('native/**') }}
      # The pinned Bun the reference kernel runs on in the kernel conformance suite; the tests
      # download it and check its digest (tests/Fx.Kernel.Tests/PinnedBun.fs holds the pin).
      - name: Cache the pinned Bun
        uses: actions/cache@v6
        with:
          path: artifacts/kernel-bun-ts/runtimes
          key: pinned-bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tests/Fx.Kernel.Tests/PinnedBun.fs') }}
      # Runs scripts/packages.ts; the extensions themselves run on the pinned Bun the tests download.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - name: Restore (locked)
        run: dotnet restore Fx.slnx --locked-mode
      - name: Build
        run: dotnet build Fx.slnx --no-restore --configuration Release
      # Packs the SDKs and builds the sample extension from the packages alone; the tests run it.
      - name: Pack the SDKs and build an extension from the packages
        run: bun scripts/packages.ts
      - name: Test
        env:
          PACKAGE_TESTS: "1"
        run: dotnet test --solution Fx.slnx --no-build --configuration Release
      - name: Upload the SDK packages
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: sdk-packages
          path: artifacts/packages/
          if-no-files-found: error
      # Installs the pinned Bun (fx.runtime.bun) from GitHub through the planner and the component
      # installer, launches it hardened, and runs the positive controls. Its own step, so a network
      # failure is told apart from a failing test. The fast tier runs it on Linux only (two minutes on
      # Windows), unless the runtime, the installer or the kernel changed.
      - name: Install and launch the pinned Bun (network)
        if: matrix.os == 'ubuntu-latest' || needs.plan.outputs.network-all-os == 'true'
        env:
          NETWORK_TESTS: "1"
        run: dotnet test --project tests/Fx.Ext.RuntimeBun.Tests --no-build --configuration Release

  aot:
    # Native AOT publish of the CLI and the JIT-vs-native diff (spec §20), on every target natively:
    # no cross-compilation, so each binary also runs where it was built.
    # The targets come from the plan (scripts/ci-plan.ts holds the list): all eight in the full tier,
    # linux-x64, linux-musl-x64, osx-arm64 and win-x64 in the fast tier.
    name: AOT (${{ matrix.rid }})
    needs: plan
    if: needs.plan.outputs.aot-run == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.aot) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      RID: ${{ matrix.rid }}
      # The musl jobs run every command in the Alpine container started below.
      IN: ${{ matrix.alpine && 'docker exec alpine' || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        if: ${{ !matrix.alpine }}
        with:
          global-json-file: global.json
      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-aot-${{ matrix.rid }}-${{ hashFiles('global.json', 'Directory.Packages.props', '**/packages.lock.json') }}
          restore-keys: nuget-aot-${{ matrix.rid }}-
      - name: Cache native libraries
        uses: actions/cache@v6
        with:
          path: artifacts/native
          key: native-${{ matrix.rid }}-${{ hashFiles('native/**') }}
      - name: Start the Alpine container
        if: ${{ matrix.alpine }}
        run: >-
          docker run --detach --name alpine
          --user "$(id -u):$(id -g)" --env HOME=/tmp
          --env CI --env GITHUB_ACTIONS --env NUGET_PACKAGES
          --env DOTNET_CLI_TELEMETRY_OPTOUT --env DOTNET_NOLOGO --env DOTNET_SKIP_FIRST_TIME_EXPERIENCE
          --volume "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" --workdir "$GITHUB_WORKSPACE"
          "$ALPINE_SDK_IMAGE" sleep infinity
      - name: Restore (locked)
        run: $IN dotnet restore Fx.slnx --locked-mode
      - name: Publish the CLI
        run: $IN dotnet publish src/Fx.Cli --configuration Release --runtime "$RID"
      - name: Publish the AOT scenarios
        run: $IN dotnet publish tests/aot/Fx.Aot.Scenarios --configuration Release --runtime "$RID"
      - name: Smoke test the native binary
        id: smoke
        run: |
          name=$($IN dotnet msbuild src/Fx.Cli -getProperty:AssemblyName | tr -d '\r')
          echo "name=$name" >> "$GITHUB_OUTPUT"
          bin="artifacts/publish/Fx.Cli/release_$RID/$name"
          ls -l "$(dirname "$bin")"
          version=$($IN "$bin" --version | tr -d '\r')
          echo "$version"
          [[ "$version" == "$name "* ]]
          $IN "$bin" --help
      - name: Smoke test envd mode
        run: |
          bin="artifacts/publish/Fx.Cli/release_$RID/${{ steps.smoke.outputs.name }}"
          dir="artifacts/envd-smoke"
          rm -rf "$dir" && mkdir -p "$dir/workspace" "$dir/state"
          request='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersions":["1"],"peer":{"name":"ci","version":"0"},"capabilities":{"maxMessageSize":1048576},"environmentProtocol":"1"}}'
          # Standard input must reach the container: `docker exec -i`.
          run=""
          [[ -n "$IN" ]] && run="docker exec -i alpine"
          reply=$(echo "$request" | $run "$bin" envd --stdio --workspace "$dir/workspace" --state "$dir/state" | tr -d '\r')
          echo "$reply"
          grep -q '"environmentProtocol":"1"' <<< "$reply"
          grep -q '"platform":{' <<< "$reply"
      - name: SQLite is linked into the binary
        run: |
          dir="artifacts/publish/Fx.Cli/release_$RID"
          name="${{ steps.smoke.outputs.name }}"
          exe=""
          [[ "$RID" == win-* ]] && exe=".exe"
          if ls "$dir" | grep -iE 'sqlite.*\.(so|dylib|dll|a|lib)$'; then
            echo "::error::a SQLite library was published next to the binary"
            exit 1
          fi
          # The binary alone in an empty directory: the library name is unique to the binding, so
          # nothing else could satisfy its imports.
          alone="artifacts/standalone/$RID"
          rm -rf "$alone" && mkdir -p "$alone" && cp "$dir/$name$exe" "$alone/"
          info=$($IN "$alone/$name" --build-info | tr -d '\r')
          echo "$info"
          version=$($IN dotnet msbuild src/Fx.Sqlite -getProperty:FxSqliteVersion | tr -d '\r')
          grep -q "^sqlite $version " <<< "$info"
      - name: Report binary sizes
        run: |
          exe=""
          [[ "$RID" == win-* ]] && exe=".exe"
          {
            echo "### Native AOT binaries, $RID"
            echo "| Binary | Bytes |"
            echo "|---|---:|"
            for bin in "Fx.Cli/release_$RID/${{ steps.smoke.outputs.name }}" "Fx.Aot.Scenarios/release_$RID/Fx.Aot.Scenarios"; do
              echo "| $(basename "$bin") | $(wc -c < "artifacts/publish/$bin$exe" | tr -d ' ') |"
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: JIT-vs-native diff
        run: $IN dotnet run --project tests/aot/Fx.Aot.Diff --configuration Release -- --rid "$RID" --no-publish
      - name: JIT-vs-native diff self-test
        run: $IN dotnet run --project tests/aot/Fx.Aot.Diff --configuration Release --no-build -- --rid "$RID" --no-publish --self-test
      - name: Upload the native binary
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.smoke.outputs.name }}-${{ matrix.rid }}
          path: artifacts/publish/Fx.Cli/release_${{ matrix.rid }}/
          if-no-files-found: error

  keyring:
    # The OS keyrings (src/Fx.Keyring, docs/spikes/keychains.md) where CI has to provide one: a
    # gnome-keyring under dbus-run-session on Linux (glibc, and musl in Alpine) and a temporary
    # keychain on macOS. Windows needs nothing: the build job's tests and the AOT jobs' scenarios use
    # its Credential Manager. Each job proves, natively, that the probe tells every headless state
    # apart, runs the live tests (the keyring's, and the credential-store conformance suite on the
    # keyring store, docs/modules/auth.md), and runs the keyring scenarios of the JIT-vs-native diff.
    # Targets from the plan: every one in the full tier; in the fast tier only when keyring or
    # credential code changed, and then without the Intel Mac.
    name: Keyring (${{ matrix.rid }})
    needs: plan
    if: needs.plan.outputs.keyring-run == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.keyring) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    env:
      RID: ${{ matrix.rid }}
      IN: ${{ matrix.alpine && 'docker exec alpine' || '' }}
      # A throwaway keyring's password, not a secret.
      KEYRING_TEST_PASSWORD: keyring-ci-password
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        if: ${{ !matrix.alpine }}
        with:
          global-json-file: global.json
      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-aot-${{ matrix.rid }}-${{ hashFiles('global.json', 'Directory.Packages.props', '**/packages.lock.json') }}
          restore-keys: nuget-aot-${{ matrix.rid }}-
      - name: Cache native libraries
        uses: actions/cache@v6
        with:
          path: artifacts/native
          key: native-${{ matrix.rid }}-${{ hashFiles('native/**') }}
      - name: Start the Alpine container
        if: ${{ matrix.alpine }}
        run: >-
          docker run --detach --name alpine
          --user "$(id -u):$(id -g)" --env HOME=/tmp
          --env CI --env GITHUB_ACTIONS --env NUGET_PACKAGES --env KEYRING_TEST_PASSWORD
          --env DOTNET_CLI_TELEMETRY_OPTOUT --env DOTNET_NOLOGO --env DOTNET_SKIP_FIRST_TIME_EXPERIENCE
          --volume "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" --workdir "$GITHUB_WORKSPACE"
          "$ALPINE_SDK_IMAGE" sleep infinity
      - name: Install D-Bus and gnome-keyring (Ubuntu)
        if: ${{ runner.os == 'Linux' && !matrix.alpine }}
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends dbus dbus-bin gnome-keyring libsecret-tools
      - name: Install D-Bus and gnome-keyring (Alpine)
        if: ${{ matrix.alpine }}
        run: |
          docker exec --user root alpine apk add --no-cache dbus gnome-keyring
          docker exec --user root alpine dbus-uuidgen --ensure
          # dbus-daemon refuses to start for a user that is not in the password database.
          docker exec --user root alpine sh -c "echo 'ci:x:$(id -u):$(id -g)::/tmp:/bin/sh' >> /etc/passwd"
      - name: Restore (locked)
        run: $IN dotnet restore Fx.slnx --locked-mode
      - name: Build the keyring tests
        run: |
          $IN dotnet build tests/Fx.Keyring.Tests --no-restore --configuration Release
          $IN dotnet build tests/Fx.Auth.Tests --no-restore --configuration Release
      - name: Publish the AOT scenarios
        run: $IN dotnet publish tests/aot/Fx.Aot.Scenarios --configuration Release --runtime "$RID"
      # gnome-keyring-daemon returns before it owns org.freedesktop.secrets, so every script waits
      # for the name; each session gets its own XDG_RUNTIME_DIR, so no other daemon's control socket
      # (or systemd's socket unit) is found.
      - name: Write the Secret Service scripts (Linux)
        if: ${{ runner.os == 'Linux' }}
        run: |
          cat > artifacts/keyring-wait.sh <<'EOF'
          for i in $(seq 1 100); do
            if dbus-send --session --print-reply --dest=org.freedesktop.DBus /org/freedesktop/DBus \
                org.freedesktop.DBus.NameHasOwner string:org.freedesktop.secrets 2>/dev/null | grep -q 'boolean true'; then
              exit 0
            fi
            sleep 0.1
          done
          echo "org.freedesktop.secrets has no owner" >&2
          exit 1
          EOF
          cat > artifacts/keyring-detect.sh <<'EOF'
          set -eu
          bin="artifacts/publish/Fx.Aot.Scenarios/release_$1/Fx.Aot.Scenarios"
          env -u DBUS_SESSION_BUS_ADDRESS -u XDG_RUNTIME_DIR KEYRING_EXPECT="unavailable: no-session-bus" "$bin" run keyring-detect
          export XDG_RUNTIME_DIR="$(mktemp -d)"
          dbus-run-session -- env KEYRING_EXPECT="unavailable: no-secret-service" "$bin" run keyring-detect
          export XDG_RUNTIME_DIR="$(mktemp -d)"
          dbus-run-session -- sh -c '
            set -eu
            gnome-keyring-daemon --start --components=secrets >/dev/null
            sh artifacts/keyring-wait.sh
            KEYRING_EXPECT="unavailable: no-default-collection" "$0" run keyring-detect
          ' "$bin"
          export XDG_RUNTIME_DIR="$(mktemp -d)"
          dbus-run-session -- sh -c '
            set -eu
            printf %s "$KEYRING_TEST_PASSWORD" | gnome-keyring-daemon --unlock --components=secrets >/dev/null
            sh artifacts/keyring-wait.sh
            KEYRING_EXPECT=ready "$0" run keyring-detect
            dbus-send --session --print-reply --dest=org.freedesktop.secrets /org/freedesktop/secrets \
              org.freedesktop.Secret.Service.Lock array:objpath:/org/freedesktop/secrets/collection/login >/dev/null
            KEYRING_EXPECT=locked "$0" run keyring-detect
          ' "$bin"
          EOF
          cat > artifacts/keyring-live.sh <<'EOF'
          set -eu
          export XDG_RUNTIME_DIR="$(mktemp -d)"
          exec dbus-run-session -- sh -c '
            set -eu
            printf %s "$KEYRING_TEST_PASSWORD" | gnome-keyring-daemon --unlock --components=secrets >/dev/null
            sh artifacts/keyring-wait.sh
            export KEYRING_TESTS=1
            dotnet test --project tests/Fx.Keyring.Tests --no-build --configuration Release
            dotnet test --project tests/Fx.Auth.Tests --no-build --configuration Release
            dotnet run --project tests/aot/Fx.Aot.Diff --configuration Release -- --rid "$0" --no-publish --only keyring-
          ' "$1"
          EOF
      # The probe never starts a service (no D-Bus activation), so each state below is what the
      # machine is, told apart by the native binary.
      - name: Headless detection, natively (Linux)
        if: ${{ runner.os == 'Linux' }}
        run: $IN sh artifacts/keyring-detect.sh "$RID"
      - name: Live tests and the keyring scenarios of the JIT-vs-native diff (Linux)
        if: ${{ runner.os == 'Linux' }}
        run: $IN sh artifacts/keyring-live.sh "$RID"
      - name: Create a temporary keychain (macOS)
        if: ${{ runner.os == 'macOS' }}
        run: |
          bin="artifacts/publish/Fx.Aot.Scenarios/release_$RID/Fx.Aot.Scenarios"
          echo "The runner's own default keychain: $(security default-keychain -d user)"
          "$bin" run keyring-detect
          keychain="$RUNNER_TEMP/keyring-ci.keychain-db"
          security create-keychain -p "$KEYRING_TEST_PASSWORD" "$keychain"
          security set-keychain-settings "$keychain"
          security unlock-keychain -p "$KEYRING_TEST_PASSWORD" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security default-keychain -d user -s "$keychain"
          echo "KEYRING_TEST_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
      - name: Live tests and the keyring scenarios of the JIT-vs-native diff (macOS)
        if: ${{ runner.os == 'macOS' }}
        env:
          KEYRING_TESTS: "1"
        run: |
          dotnet test --project tests/Fx.Keyring.Tests --no-build --configuration Release
          dotnet test --project tests/Fx.Auth.Tests --no-build --configuration Release
          dotnet run --project tests/aot/Fx.Aot.Diff --configuration Release -- --rid "$RID" --no-publish --only keyring-
      - name: Headless detection, natively (macOS)
        if: ${{ runner.os == 'macOS' }}
        run: |
          bin="artifacts/publish/Fx.Aot.Scenarios/release_$RID/Fx.Aot.Scenarios"
          KEYRING_EXPECT=ready "$bin" run keyring-detect
          security lock-keychain "$KEYRING_TEST_KEYCHAIN"
          KEYRING_EXPECT=locked "$bin" run keyring-detect
          security unlock-keychain -p "$KEYRING_TEST_PASSWORD" "$KEYRING_TEST_KEYCHAIN"
      - name: Delete the temporary keychain (macOS)
        if: ${{ always() && runner.os == 'macOS' && env.KEYRING_TEST_KEYCHAIN != '' }}
        run: |
          security default-keychain -d user -s login.keychain-db || true
          security delete-keychain "$KEYRING_TEST_KEYCHAIN" || true

  bun-musl:
    # fx.runtime.bun on musl (the build job covers glibc, macOS and Windows): installs the pinned Bun's
    # musl build from GitHub through the component installer, launches it hardened and runs the
    # positive controls, in the Alpine container the musl AOT jobs use. Then fx.interpreter.bun-ts on
    # it: the kernel conformance suite and the interpreter's end-to-end tests.
    # Architectures from the plan: both in the full tier; x64 in the fast tier when the runtime, the
    # installer or the kernel changed.
    name: Pinned Bun on musl (${{ matrix.arch }})
    needs: plan
    if: needs.plan.outputs.bun-musl-run == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.bun-musl) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-bun-musl-${{ matrix.arch }}-${{ hashFiles('global.json', 'Directory.Packages.props', '**/packages.lock.json') }}
          restore-keys: nuget-bun-musl-${{ matrix.arch }}-
      - name: Start the Alpine container
        run: >-
          docker run --detach --name alpine
          --user "$(id -u):$(id -g)" --env HOME=/tmp
          --env CI --env GITHUB_ACTIONS --env NUGET_PACKAGES
          --env DOTNET_CLI_TELEMETRY_OPTOUT --env DOTNET_NOLOGO --env DOTNET_SKIP_FIRST_TIME_EXPERIENCE
          --env NETWORK_TESTS=1
          --volume "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" --workdir "$GITHUB_WORKSPACE"
          "$ALPINE_SDK_IMAGE" sleep infinity
      - name: Restore (locked)
        run: docker exec alpine dotnet restore tests/Fx.Ext.RuntimeBun.Tests --locked-mode
      - name: Install and launch the pinned Bun (network)
        run: docker exec alpine dotnet test --project tests/Fx.Ext.RuntimeBun.Tests --no-restore --configuration Release
      - name: Restore the kernel tests (locked)
        run: |
          docker exec alpine dotnet restore tests/Fx.Kernel.Tests --locked-mode
          docker exec alpine dotnet restore tests/Fx.Ext.InterpreterBunTs.Tests --locked-mode
      # The kernel conformance suite (the bun-ts kernel on the pinned musl Bun) and the interpreter end
      # to end. The tests download the pinned Bun themselves and check its digest.
      - name: bun-ts kernel conformance on musl
        run: docker exec alpine dotnet test --project tests/Fx.Kernel.Tests --no-restore --configuration Release
      - name: bun-ts interpreter on musl
        run: docker exec alpine dotnet test --project tests/Fx.Ext.InterpreterBunTs.Tests --no-restore --configuration Release

  # The spike is superseded by packages/kernel-bun-ts: only when it changes, and nightly.
  bun-kernel-spike:
    name: Bun kernel spike (${{ matrix.os }})
    needs: plan
    if: needs.plan.outputs.spike == 'true'
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: spikes/bun-kernel
    steps:
      - uses: actions/checkout@v7
      # Runs the tests only. The kernel itself runs on the pinned Bun the tests download and verify.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - name: Install (frozen)
        run: bun install --frozen-lockfile
      - name: Type-check
        run: bun check --no-script
      - name: Test
        run: bun test
      - name: Benchmark
        shell: bash
        run: bun bench/bench.ts | tee -a "$GITHUB_STEP_SUMMARY"

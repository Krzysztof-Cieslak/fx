name: PTY probe

# What a terminal looks like on every target (docs/spikes/pty.md): the raw output ConPTY adds,
# terminal queries, latency, throughput, exit codes and terminal settings. Runs when the probe or
# Fx.Pty changes, or by hand. Measurements only: the CI workflow tests behaviour.
on:
  pull_request:
    paths:
      - docs/spikes/pty-probe/**
      - src/Fx.Pty/**
      - .github/workflows/pty-probe.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
  # Same image as the musl AOT jobs in ci.yml; keep them in step.
  ALPINE_SDK_IMAGE: mcr.microsoft.com/dotnet/sdk:11.0.100-alpine3.24-aot@sha256:a6a89666d050f5d4806aa03edbc677291c7fb92191b5b2a8f3bccdec869ab87a

jobs:
  probe:
    name: Probe (${{ matrix.rid }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: linux-x64, os: ubuntu-24.04 }
          - { rid: linux-arm64, os: ubuntu-24.04-arm }
          - { rid: linux-musl-x64, os: ubuntu-24.04, alpine: true }
          - { rid: linux-musl-arm64, os: ubuntu-24.04-arm, alpine: true }
          - { rid: osx-arm64, os: macos-26 }
          - { rid: osx-x64, os: macos-26-intel }
          - { rid: win-x64, os: windows-2025 }
          - { rid: win-arm64, os: windows-11-arm }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      IN: ${{ matrix.alpine && 'docker exec alpine' || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        if: ${{ !matrix.alpine }}
        with:
          global-json-file: global.json
      - name: Start the Alpine container
        if: ${{ matrix.alpine }}
        run: >-
          docker run --detach --name alpine
          --user "$(id -u):$(id -g)" --env HOME=/tmp
          --env CI --env GITHUB_ACTIONS --env NUGET_PACKAGES
          --env DOTNET_CLI_TELEMETRY_OPTOUT --env DOTNET_NOLOGO --env DOTNET_SKIP_FIRST_TIME_EXPERIENCE
          --volume "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" --workdir "$GITHUB_WORKSPACE"
          "$ALPINE_SDK_IMAGE" sleep infinity
      - name: Build Fx.Pty
        run: $IN dotnet build src/Fx.Pty --configuration Release
      - name: Probe
        run: |
          echo "### PTY probe, ${{ matrix.rid }} (${{ matrix.os }})" >> "$GITHUB_STEP_SUMMARY"
          $IN dotnet fsi docs/spikes/pty-probe/probe.fsx | tee -a "$GITHUB_STEP_SUMMARY"
